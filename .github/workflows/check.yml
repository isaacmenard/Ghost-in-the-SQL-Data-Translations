name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check out the base branch beside the change
        run: git worktree add ../base "origin/${{ github.base_ref }}"
      - name: Check the changed lines
        run: node scripts/check.mjs --base=../base
